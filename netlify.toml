# Netlify Deployment Configuration
#
# After pushing this repo to GitHub and connecting it to Netlify:
# 1. Set VITE_API_URL as an environment variable in Netlify dashboard
#    (pointing to your Render backend, e.g. https://your-app.onrender.com)
# 2. Deploy will auto-build and publish the dist/ folder

[build]
  command = "npm run build"
  publish = "dist"

# SPA redirect — all routes go to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets aggressively
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
